name: Build & Release Go Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  APP_NAME: "xray-collector"
  LICENSE_FILE: "LICENSE"
  GO_VERSION: "1.25.2"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        run: |
          mkdir -p dist
          BIN_NAME=${APP_NAME}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BIN_NAME=${APP_NAME}.exe
          fi
          echo "Building $BIN_NAME for ${{ matrix.goos }}/${{ matrix.goarch }}..."
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -o dist/$BIN_NAME

      - name: Prepare ZIP package
        run: |
          PKG_NAME=${APP_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}.zip
          zip -j $PKG_NAME dist/* $LICENSE_FILE

      - name: Generate SHA256 checksum
        run: |
          ZIP_FILE=${APP_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}.zip
          sha256sum $ZIP_FILE > ${ZIP_FILE}.sha256sum

      - name: Upload artifact for release
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${APP_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}.zip
            ${APP_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}.zip.sha256sum

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release_artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/**
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
