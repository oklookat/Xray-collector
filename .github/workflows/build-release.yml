name: Build & Release Go Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  APP_NAME: "xray-collector"
  LICENSE_FILE: "LICENSE"
  README_FILE: "README.md"
  CHANGELOG_FILE: "CHANGELOG.md"
  GO_VERSION: "1.25.2"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Get version from tag
        id: get_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Build binary
        run: |
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            BIN_NAME="${APP_NAME}.exe"
          else
            BIN_NAME="${APP_NAME}"
          fi

          mkdir -p "dist/${{ matrix.goos }}-${{ matrix.goarch }}"

          echo "Building $BIN_NAME for ${{ matrix.goos }}/${{ matrix.goarch }}..."

          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build \
            -ldflags="-X main.Version=${{ steps.get_version.outputs.VERSION }} \
                      -X main.Commit=$(git rev-parse --short HEAD) \
                      -X main.BuildTime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -o "dist/${{ matrix.goos }}-${{ matrix.goarch }}/$BIN_NAME" \
            .

          cp "${{ env.LICENSE_FILE }}" "dist/${{ matrix.goos }}-${{ matrix.goarch }}/"
          [ -f "${{ env.README_FILE }}" ] && cp "${{ env.README_FILE }}" "dist/${{ matrix.goos }}-${{ matrix.goarch }}/"

      - name: Create release archive
        run: |
          PKG_DIR="dist/${{ matrix.goos }}-${{ matrix.goarch }}"
          PKG_NAME="${APP_NAME}_${{ steps.get_version.outputs.VERSION }}_${{ matrix.goos }}_${{ matrix.goarch }}"

          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            cd "$PKG_DIR"
            zip -r "../../${PKG_NAME}.zip" .
            cd ../..
          else
            tar -czf "${PKG_NAME}.tar.gz" -C "$PKG_DIR" .
          fi

      - name: Generate checksums
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"

          for archive in ${APP_NAME}_${VERSION}_*.{zip,tar.gz}; do
            if [ -f "$archive" ]; then
              echo "Generating checksum for $archive"
              shasum -a 256 "$archive" > "${archive}.sha256"
            fi
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ env.APP_NAME }}_${{ steps.get_version.outputs.VERSION }}_${{ matrix.goos }}_${{ matrix.goarch }}.*
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changelog file
        id: check_changelog
        run: |
          if [ -f "${{ env.CHANGELOG_FILE }}" ]; then
            echo "Changelog file found: ${{ env.CHANGELOG_FILE }}"
            echo "has_changelog=true" >> $GITHUB_OUTPUT
          else
            echo "Changelog file not found: ${{ env.CHANGELOG_FILE }}"
            echo "has_changelog=false" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: "*"
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            artifacts/${{ env.APP_NAME }}_*.tar.gz
            artifacts/${{ env.APP_NAME }}_*.tar.gz.sha256
            artifacts/${{ env.APP_NAME }}_*.zip
            artifacts/${{ env.APP_NAME }}_*.zip.sha256
          body_path: ${{ env.CHANGELOG_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
