name: Build & Release Go Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  APP_NAME: "xray-collector"
  LICENSE_FILE: "LICENSE"
  README_FILE: "README.md"
  GO_VERSION: "1.25.2"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Get version from tag
        id: get_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Build binary
        run: |
          # Set binary name with extension
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            BIN_NAME="${APP_NAME}.exe"
          else
            BIN_NAME="${APP_NAME}"
          fi

          # Create output directory
          mkdir -p "dist/${{ matrix.goos }}-${{ matrix.goarch }}"

          echo "Building $BIN_NAME for ${{ matrix.goos }}/${{ matrix.goarch }}..."

          # Build with version information
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build \
            -ldflags="-X main.Version=${{ steps.get_version.outputs.VERSION }} \
                      -X main.Commit=$(git rev-parse --short HEAD) \
                      -X main.BuildTime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -o "dist/${{ matrix.goos }}-${{ matrix.goarch }}/$BIN_NAME" \
            .

          # Copy supporting files
          cp "${{ env.LICENSE_FILE }}" "dist/${{ matrix.goos }}-${{ matrix.goarch }}/"
          [ -f "${{ env.README_FILE }}" ] && cp "${{ env.README_FILE }}" "dist/${{ matrix.goos }}-${{ matrix.goarch }}/"

      - name: Create release archive
        run: |
          PKG_DIR="dist/${{ matrix.goos }}-${{ matrix.goarch }}"
          PKG_NAME="${APP_NAME}_${{ steps.get_version.outputs.VERSION }}_${{ matrix.goos }}_${{ matrix.goarch }}"

          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            # Create zip for Windows
            cd "$PKG_DIR"
            zip -r "../../${PKG_NAME}.zip" .
            cd ../..
          else
            # Create tar.gz for Unix-like systems
            tar -czf "${PKG_NAME}.tar.gz" -C "$PKG_DIR" .
          fi

      - name: Generate checksums
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"

          # Find and checksum all archives
          for archive in ${APP_NAME}_${VERSION}_*.{zip,tar.gz}; do
            if [ -f "$archive" ]; then
              echo "Generating checksum for $archive"
              shasum -a 256 "$archive" > "${archive}.sha256"
              echo "$(cat ${archive}.sha256)"  # Display for debugging
            fi
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ env.APP_NAME }}_${{ steps.get_version.outputs.VERSION }}_${{ matrix.goos }}_${{ matrix.goarch }}.*
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: "*"
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "Artifacts structure:"
          find artifacts -type f -name "*" | sort
          echo ""
          echo "Files for release:"
          ls -la artifacts/* || true

      - name: Verify checksums
        run: |
          cd artifacts
          echo "Verifying checksums..."
          for sha_file in *.sha256; do
            if [ -f "$sha_file" ]; then
              echo "Verifying: $sha_file"
              archive_file="${sha_file%.sha256}"
              if [ -f "$archive_file" ]; then
                shasum -a 256 -c "$sha_file"
              else
                echo "Warning: Archive file $archive_file not found for $sha_file"
              fi
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.APP_NAME }} ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/${{ env.APP_NAME }}_*.tar.gz
            artifacts/${{ env.APP_NAME }}_*.tar.gz.sha256
            artifacts/${{ env.APP_NAME }}_*.zip
            artifacts/${{ env.APP_NAME }}_*.zip.sha256
          body: |
            ## 📦 Release ${{ github.ref_name }}

            ### 🔧 Supported Platforms
            - **Linux** (amd64, arm64)
            - **macOS** (amd64, arm64)
            - **Windows** (amd64)

            ### 📝 Verification
            Verify downloaded files using SHA256 checksums:
            ```bash
            # For Unix/Linux/macOS
            sha256sum -c *.sha256

            # For Windows PowerShell
            Get-FileHash -Algorithm SHA256 file.zip
            ```

            ### ⚙️ Installation
            Extract the archive for your platform and copy the binary to your PATH.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
